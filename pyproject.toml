[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json-to-csv"
version = "1.0.0"
description = "High-performance Python converter with deep recursive flattening, array strategies, live web preview, and RFC 4180 compliance."
readme = "README.md"
authors = [{ name = "JSON to CSV Studio" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["json", "csv", "converter", "flattener", "rfc4180", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
json-to-csv = "json_to_csv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["json_to_csv*"]

[tool.setuptools.package-data]
json_to_csv = ["static/**/*", "static/*"]
